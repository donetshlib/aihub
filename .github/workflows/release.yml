# Pushing a tag like v0.7.2 builds the Windows installer and the Linux AppImage and publishes
# both in the GitHub release of that tag. The version in package.json must match the tag.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload files to it

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: --win
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node release.js ${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
