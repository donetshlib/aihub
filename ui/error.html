<!doctype html>
<!-- Shown inside a tab when its page fails to load. main.js passes url, code and lang in the query. -->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      :root { --bg: #f0f0f0; --text: #1c1c1c; --dim: #6b6b6b; --accent: #16a34a; --accent-text: #fff; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1e1e1e; --text: #eaeaea; --dim: #8f8f8f; --accent: #22c55e; --accent-text: #08240f; }
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { display: grid; place-items: center; }
      main { max-width: 460px; padding: 24px; }
      h1 { margin: 0 0 10px; font-size: 22px; font-weight: 600; }
      p { margin: 0 0 8px; line-height: 1.5; color: var(--dim); }
      code { font-size: 12px; color: var(--dim); word-break: break-all; }
      button { margin-top: 16px; padding: 9px 18px; border: none; border-radius: 10px; background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
      button:hover { filter: brightness(1.08); }
    </style>
    <script src="i18n.js"></script>
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <p id="hint"></p>
      <p><code id="detail"></code></p>
      <button id="retry"></button>
    </main>
    <script>
      const query = new URLSearchParams(location.search);
      const url = query.get('url');
      const t = (key) => translate(query.get('lang'), key);
      document.title = new URL(url).host;
      document.getElementById('title').textContent = t('errorTitle');
      document.getElementById('hint').textContent = t('errorHint');
      document.getElementById('detail').textContent = `${query.get('code')} · ${url}`;
      // replace(): the error page itself should not stay in the back history.
      const retry = () => location.replace(url);
      document.getElementById('retry').textContent = t('retry');
      document.getElementById('retry').onclick = retry;
      addEventListener('online', retry);
    </script>
  </body>
</html>
